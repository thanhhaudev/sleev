name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show installed Xcode versions
        run: ls /Applications | grep -E '^Xcode' || true

      - name: Select Xcode
        # macos-26 runner ships with multiple Xcode versions in /Applications.
        # The app targets macOS 26, so Xcode 26.x (with the macOS 26 SDK) is
        # required; prefer the highest available.
        run: |
          set -e
          for v in 26.2 26.1 26.0; do
            if [ -d "/Applications/Xcode_${v}.app" ]; then
              sudo xcode-select -switch "/Applications/Xcode_${v}.app"
              echo "Selected Xcode $v"
              exit 0
            fi
          done
          echo "No preferred Xcode found; using default $(xcode-select -p)"

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install xcodegen, swiftlint, swiftformat
        run: brew install xcodegen swiftlint swiftformat

      - name: SwiftLint (strict)
        run: swiftlint --strict

      - name: SwiftFormat (lint)
        run: swiftformat --lint .

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild \
            -scheme Sleev \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Test
        run: |
          xcodebuild \
            -scheme Sleev \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            test

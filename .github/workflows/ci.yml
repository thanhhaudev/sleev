name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show installed Xcode versions
        run: ls /Applications | grep -E '^Xcode' || true

      - name: Select Xcode
        # macos-14 runner ships with multiple Xcode versions in /Applications.
        # Prefer the highest 16.x, then fall back to 15.x. xcodegen 2.45+
        # generates project format 77 which requires Xcode 16+.
        run: |
          set -e
          for v in 16.2 16.1 15.4 15.3 15.2 15.1 15.0; do
            if [ -d "/Applications/Xcode_${v}.app" ]; then
              sudo xcode-select -switch "/Applications/Xcode_${v}.app"
              echo "Selected Xcode $v"
              exit 0
            fi
          done
          echo "No preferred Xcode found; using default $(xcode-select -p)"

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install xcodegen, swiftlint, swiftformat
        run: brew install xcodegen swiftlint swiftformat

      - name: SwiftLint (strict)
        run: swiftlint --strict

      - name: SwiftFormat (lint)
        run: swiftformat --lint .

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild \
            -scheme Sleev \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Test
        run: |
          xcodebuild \
            -scheme Sleev \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            test

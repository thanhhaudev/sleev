name: Sleev
options:
  bundleIdPrefix: com.thanhhaudev.sleev
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "3"

targets:
  SleevCore:
    type: framework
    platform: macOS
    sources:
      - SleevCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thanhhaudev.sleev.SleevCore
        SKIP_INSTALL: NO
        GENERATE_INFOPLIST_FILE: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
          - "@loader_path/Frameworks"

  Sleev:
    type: application
    platform: macOS
    sources:
      - Sleev
      - Sleev/Resources/Assets.xcassets
    dependencies:
      - target: SleevCore
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thanhhaudev.sleev.Sleev
        INFOPLIST_FILE: Sleev/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sleev/Sleev.entitlements
        LSUIElement: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"

  SleevTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - SleevTests
    dependencies:
      - target: Sleev
      - target: SleevCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thanhhaudev.sleev.SleevTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Sleev:
    build:
      targets:
        Sleev: all
        SleevCore: all
    run:
      config: Debug
      commandLineArguments:
        "--preview-onboarding": false
        "--preview-statusbar": false
    test:
      config: Debug
      targets:
        - SleevTests
    archive:
      config: Release
